name: Clone changes to Azure DevOps repository

on:
  push:
    branches:
      - "**"

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          # Perform a full clone.
          fetch-depth: 0

      - name: Set up local Git configuration
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Add Azure DevOps remote
        run: |
          git remote add azure "https://user:${{ secrets.AZURE_DEVOPS_PAT }}@dev.azure.com/${{ vars.AZURE_DEVOPS_ORG }}/${{ vars.AZURE_DEVOPS_PROJECT }}/_git/${{ vars.AZURE_DEVOPS_REPO }}"

      - name: Push to Azure DevOps
        run: |
          git push --mirror azure
